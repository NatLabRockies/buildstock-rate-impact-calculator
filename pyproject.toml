[project]
authors = [{name = "Eric Ringold", email = "Eric.Ringold@nlr.gov"}]
dependencies = []
# A modified BSD-3-Clause (extra clauses 3 and 4), so no SPDX license expression.
license-files = ["LICENSE.md"]
name = "buildstock-rate-impact-calculator"
requires-python = ">=3.11,<3.14"
version = "v0.9.0"

[project.scripts]
bric = "buildstock_rate_impact_calculator.launcher:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
# 1.42+ bundle mimalloc 3.3.2, which crashes on Windows when threads exit
# (access violation in _polars_runtime.pyd; pola-rs/polars#29883).
polars = "==1.41.2"
requests = "*"
numpy = "*"
tqdm = "*"
python-dotenv = "*"
certifi = "*"
python-dateutil = "*"
pip-system-certs = ">=5.3,<6"

[tool.pixi.pypi-dependencies]
buildstock_rate_impact_calculator = { path = ".", editable = true }
NREL-PySAM = "*"
# 1.66+ is compatible with Starlette >=1.x GZip internals (older releases
# raise "Expected ASGI message 'http.response.start'" on static assets).
streamlit = ">=1.66"
streamlit-folium = "*"
folium = "*"
altair = "*"
# From PyPI rather than conda-forge: conda-forge's libarrow brings S3, GCS and
# Azure client libraries (grpc, protobuf, OpenTelemetry, AWS SDK; ~650 MB
# installed) that BRIC never uses. Streamlit excludes pyarrow 25.0.0.
pyarrow = "!=25.0.0"

# conda-forge numpy uses MKL on Windows by default (~600 MB installed with its
# tbb/hwloc/icu dependencies); BRIC does little linear algebra.
[tool.pixi.target.win-64.dependencies]
libblas = { version = "*", build = "*openblas" }

# Development tools, kept out of the "standalone" environment that the
# stand-alone zips ship (standalone/build_dist.py packs that one).
[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-mock = "*"
ruff = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
standalone = { features = [], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests/ -v"
test-integration = "pytest tests/ -v --integration -s"
app = "streamlit run src/buildstock_rate_impact_calculator/app.py"
# Stand-alone zips for every platform -> dist/ (see standalone/README.md)
pack = "python standalone/build_dist.py"
lint = "ruff check src/"
fetch-utilities = "python scripts/fetch_utility_companies.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
