[project]
authors = [{name = "Eric Ringold", email = "Eric.Ringold@nlr.gov"}]
dependencies = []
name = "buildstock-rate-impact-calculator"
requires-python = ">=3.11,<3.14"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
polars = ">=0.20"
fsspec = "*"
requests = "*"
numpy = "*"
pyarrow = "*"
tqdm = "*"
python-dotenv = "*"
pytest = "*"
pytest-mock = "*"
ruff = "*"
certifi = "*"
python-dateutil = "*"
aiohttp = "*"
pip-system-certs = ">=5.3,<6"

[tool.pixi.pypi-dependencies]
buildstock_rate_impact_calculator = { path = ".", editable = true }
NREL-PySAM = "*"
streamlit = ">=1.30"
streamlit-folium = "*"
folium = "*"
altair = "*"

[tool.pixi.tasks]
test = "pytest tests/ -v"
app = "streamlit run app.py"
lint = "ruff check src/"
fetch-utilities = "python scripts/fetch_utility_companies.py"
